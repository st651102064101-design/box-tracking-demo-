plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.abss.rfidhtml"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }

    defaultConfig {
        applicationId = "com.abss.rfidhtml"
        // The API3 SDK's own AARs declare minSdk 26; the MC3390R's Android 8.1
        // (API 27) clears that floor.
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    sourceSets {
        // The page lives in rfid_test/ so it can also just be opened in a
        // browser (DataWedge keystroke mode) — one file, both delivery paths,
        // no copy to keep in sync.
        main.assets.srcDirs += ["../../rfid_test"]
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
        }
    }
}

// The Zebra RFID API3 SDK ships as split .aar modules. They already live in
// pda_flutter's libs/ — referenced in place rather than copied, so the two
// apps can never drift onto different SDK builds.
dependencies {
    implementation fileTree(dir: "../../pda_flutter/android/app/libs", include: ["*.jar", "*.aar"])
    implementation "androidx.appcompat:appcompat:1.7.0"
    // API3_NGE-Transport's Theme.Api3Transport extends a MaterialComponents
    // parent — needed for the manifest merger to resolve it.
    implementation "com.google.android.material:material:1.12.0"
}
