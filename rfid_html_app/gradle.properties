# -Duser.language/-Duser.country are load-bearing, not cosmetic: Java hands
# back a BuddhistCalendar for th_TH, so Calendar.get(YEAR) answers 2569. Zip
# entries carry MS-DOS timestamps, which encode the year in seven bits from
# 1980 and stop at 2107, so a Buddhist year overflows the field and apkzlib
# aborts the java-resource merge with a bare VerifyException naming nothing.
# Every build on a Thai desktop dies that way. Same rationale as pda_flutter.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
