pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Must come before dependencyResolutionManagement — Gradle allows nothing but
// buildscript/pluginManagement/plugins blocks ahead of a plugins {} block.
plugins {
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "rfid_html_app"
include ":app"
