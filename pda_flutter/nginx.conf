server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # CanvasKit is versioned by the Flutter SDK under its own path and never
  # changes within a release — the one thing here safe to cache hard.
  location ^~ /canvaskit/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything Flutter emits per build keeps the *same* filename from one build
  # to the next — main.dart.js is always main.dart.js. A long max-age therefore
  # strands terminals on the previous release until it expires, which is exactly
  # how a rebuilt image can appear not to have deployed at all.
  #
  # "no-cache" is not "don't cache": the browser still keeps its copy, it just
  # has to revalidate. Unchanged files cost one 304, and a redeploy is picked up
  # on the next load instead of a week later.
  location ~* ^/(index\.html|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|version\.json)$ {
    add_header Cache-Control "no-cache";
  }

  # Asset manifests and fonts are rewritten on every build for the same reason.
  location ^~ /assets/ {
    add_header Cache-Control "no-cache";
  }

  # Flutter web is a single-page app — every route falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
