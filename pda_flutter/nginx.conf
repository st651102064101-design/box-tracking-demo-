server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Flutter web is a single-page app — every route falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # the service worker and the bootstrap must never be cached, or an operator
  # keeps running a stale build after a redeploy
  location ~* ^/(flutter_service_worker\.js|index\.html)$ {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|woff2?|ttf|otf|json)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
