# The locale below is not cosmetic, and removing it breaks the build outright.
# Java hands back a BuddhistCalendar for th_TH, so Calendar.get(YEAR) answers
# 2569 rather than 2026. Zip entries carry MS-DOS timestamps, which encode the
# year in seven bits starting at 1980 and therefore stop at 2107; stamping a
# Buddhist year overflows that field and apkzlib aborts the java-resource merge
# with a bare VerifyException carrying no message at all. Every build on a Thai
# desktop dies that way, in every module, and the error names nothing that would
# point you here. Builds should not read the developer's locale regardless.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
