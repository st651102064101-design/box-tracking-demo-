plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin must be applied after Android/Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.abss.boxtrace_pda"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.abss.boxtrace_pda"
        // This unit is stuck on Android 8.1 (API 27, no OTA available).
        // RFIDAPI3 2.0.5.x requires API 29+ and fails at runtime on this
        // device, so the app ships RFIDAPI3 2.0.3.162 instead (documented as
        // Android 8+). AndroidManifest.xml still overrides the library's
        // declared minSdk to let the manifest merger accept it either way.
        minSdk = 27
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // Signed with debug keys so `flutter run --release` works out of the box.
            signingConfig = signingConfigs.debug
            // Flutter's release build type shrinks/minifies by default, which
            // makes R8 walk the whole class graph including rfidapi3lib's
            // optional Qualcomm integration — proguard-rules.pro tells it
            // those classes are legitimately absent, not a build error.
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

// The Zebra RFID API3 library ships as a local .aar in app/libs.
repositories {
    flatDir {
        dirs "libs"
    }
}

dependencies {
    // RFIDAPI3 2.0.3.162 — the vendor SDK ships this version as many small
    // AARs instead of one bundled jar; the MC3390R's reader classes span
    // several of them so all are pulled in together.
    implementation(name: "API3_CMN-release-2.0.3.162", ext: "aar")
    implementation(name: "API3_INTERFACE-release-2.0.3.162", ext: "aar")
    implementation(name: "API3_READER-release-2.0.3.162", ext: "aar")
    implementation(name: "API3_TRANSPORT-release-2.0.3.162", ext: "aar")
    implementation(name: "API3_ASCII-release-2.0.3.162", ext: "aar")
    implementation(name: "API3_NGE-Transportrelease-2.0.3.162", ext: "aar")
    implementation(name: "API3_NGEUSB-Transportrelease-2.0.3.162", ext: "aar")
    implementation(name: "API3_NGE-protocolrelease-2.0.3.162", ext: "aar")
    implementation(name: "API3_ZIOTC-release-2.0.3.162", ext: "aar")
    implementation(name: "API3_ZIOTCTRANSPORT-release-2.0.3.162", ext: "aar")
    implementation(name: "API3_LLRP-release-2.0.3.162", ext: "aar")
    implementation(name: "rfidhostlib", ext: "aar")
    implementation(name: "rfidseriallib", ext: "aar")
    implementation "com.google.code.gson:gson:2.13.2"
    implementation "androidx.core:core-ktx:1.13.1"
    // API3_NGE-Transport's Theme.Api3Transport extends a MaterialComponents
    // parent — pull the library in so the manifest merger can resolve it.
    implementation "com.google.android.material:material:1.12.0"
}
