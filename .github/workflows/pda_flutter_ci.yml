name: pda_flutter CI

on:
  push:
    paths:
      - 'pda_flutter/**'
      - '.github/workflows/pda_flutter_ci.yml'
  pull_request:
    paths:
      - 'pda_flutter/**'
      - '.github/workflows/pda_flutter_ci.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pda_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
